[package]
name = "armature-compression"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-compression"
homepage = "https://quinnjr.github.io/armature"
description = "HTTP compression middleware with gzip, brotli, and zstd support"
keywords = ["compression", "gzip", "brotli", "zstd", "middleware"]
categories = ["compression", "web-programming"]

[dependencies]
# Core dependencies
armature-core = { version = "0.8" }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
bytes = "1"

# Gzip compression (optional)
flate2 = { version = "1.1", optional = true }

# Brotli compression (optional)
brotli = { version = "8.0", optional = true }

# Zstd compression (optional)
zstd = { version = "0.13", optional = true }

[features]
default = ["gzip", "brotli"]
gzip = ["dep:flate2"]
brotli = ["dep:brotli"]
zstd = ["dep:zstd"]
full = ["gzip", "brotli", "zstd"]

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }

